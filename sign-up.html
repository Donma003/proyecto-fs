<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="sign-up" content="width=device-width, initial-scale=1">
  <title>Registro de Usuario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-light bg-light">
  <div class="container">
    <a class="navbar-brand" href="index.html">LautarekeStore</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="index.html#productos">Productos</a></li>
        <li class="nav-item"><a class="nav-link active" href="registro.html">Registro Usuario</a></li>
        <li class="nav-item"><a class="nav-link" href="index.html#contacto">Contacto</a></li>
        <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-cart"></i> (0)</a></li>
      </ul>
    </div>
  </div>
</nav>

  <section class="py-5">
    <div class="container">
      <h2 class="text-center mb-4">Registro de usuario</h2>
      <form class="bg-light p-4 shadow-sm rounded">
        <div class="mb-3">
          <label for="nombre" class="form-label">Nombre completo</label>
          <input type="text" class="form-control" id="nombre" required>
        </div>

        <div class="mb-3">
          <label for="correo" class="form-label">Correo</label>
          <input type="email" class="form-control" id="correo" required>
        </div>

        <div class="mb-3">
          <label for="confirmarCorreo" class="form-label">Confirmar correo</label>
          <input type="email" class="form-control" id="confirmarCorreo" required>
        </div>

        <div class="mb-3">
          <label for="contrasena" class="form-label">Contraseña</label>
          <input type="password" class="form-control" id="contrasena" required>
        </div>

        <div class="mb-3">
          <label for="confirmarContrasena" class="form-label">Confirmar contraseña</label>
          <input type="password" class="form-control" id="confirmarContrasena" required>
        </div>

        <div class="mb-3">
          <label for="telefono" class="form-label">Teléfono (opcional)</label>
          <input type="tel" class="form-control" id="telefono">
        </div>

        <div class="mb-3">
          <label for="region" class="form-label">Selecciona tu región</label>
          <select class="form-select" id="region" required>
            <option selected disabled value="">Elige una región</option>
            <option>Región de Arica y Parinacota</option>
            <option>Región de Tarapacá</option>
          </select>
        </div>

        <div class="mb-3">
          <label for="comuna" class="form-label">Selecciona tu comuna</label>
          <select class="form-select" id="comuna" required>
            <option selected disabled value="">Elige una comuna</option>
          </select>
        </div>

        <div class="d-grid">
          <button type="submit" class="btn btn-primary">REGISTRAR</button>
        </div>
      </form>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
