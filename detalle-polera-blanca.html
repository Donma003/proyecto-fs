<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Detalle - Polera Blanca</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">
      <a href="index.html" class="navbar-brand"><span class="text-primary">Lautareke</span>Store</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#navbar-start" aria-controls="navbar-start"
              aria-expanded="false" aria-label="Toggle-navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbar-start">
        <ul class="navbar-nav mx-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html#productos">Productos</a></li>
          <li class="nav-item"><a class="nav-link" href="blog.html">Datos curiosos</a></li>
          <li class="nav-item"><a class="nav-link" href="registro.html">Crear cuenta</a></li>
          <li class="nav-item"><a class="nav-link" href="login.html">Iniciar sesión</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html#contacto">Contacto</a></li>
        </ul>
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" href="carrito.html">
              <i class="bi bi-cart-fill" style="font-size: 1.2rem;"></i>
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-5">
    <div class="row">
      <div class="col-md-6">
        <img src="images/poleraBlanca.webp" class="img-fluid" alt="Polera Blanca">
      </div>
      <div class="col-md-6">
        <h2>Polera Blanca</h2>
        <h4 class="text-success">$20.000 CLP</h4>
        <p>Polera blanca de algodón suave, ideal para climas cálidos. Corte clásico, perfecta para combinar con cualquier outfit.</p>
        <label for="cantidad">Cantidad</label>
        <input type="number" id="cantidad" value="1" min="1" class="form-control mb-3">
        <button class="btn btn-primary" onclick="agregarAlCarrito()">Agregar al carrito</button>
      </div>
    </div>
  </div>

  <script>
    function agregarAlCarrito() {
      const producto = {
        nombre: "Polera Blanca",
        precio: 20000,
        cantidad: parseInt(document.getElementById("cantidad").value),
        imagen: "images/poleraBlanca.webp"
      };
      let carrito = JSON.parse(localStorage.getItem("carrito")) || [];
      carrito.push(producto);
      localStorage.setItem("carrito", JSON.stringify(carrito));
      alert("Producto agregado al carrito");
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
