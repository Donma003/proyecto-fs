<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Carrito de Compras</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">

</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">
      <a href="index.html" class="navbar-brand logo">
        <span>Lautareke</span>Store
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#navbar-start" aria-controls="navbar-start"
              aria-expanded="false" aria-label="Toggle-navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbar-start">
        <ul class="navbar-nav mx-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html#productos">Productos</a></li>
          <li class="nav-item"><a class="nav-link" href="blog.html">Blog</a></li>
          <li class="nav-item"><a class="nav-link" href="registro.html">Crear Cuenta</a></li>
          <li class="nav-item"><a class="nav-link" href="login.html">Iniciar Sesión</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html#contacto">Contacto</a></li>
        </ul>
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link active" href="carrito.html"><i class="bi bi-cart"></i> Carrito</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-5">
    <h2 class="mb-4">Tu carrito</h2>
    <div id="carrito"></div>
    <h4 class="mt-4">Total: <span id="total">$0</span></h4>
  </div>

  <script>
    function mostrarCarrito() {
      const carrito = JSON.parse(localStorage.getItem("carrito")) || [];
      const contenedor = document.getElementById("carrito");
      contenedor.innerHTML = "";
      let total = 0;

      carrito.forEach((producto, index) => {
        const subtotal = producto.precio * producto.cantidad;
        total += subtotal;

        const item = document.createElement("div");
        item.className = "card mb-3 p-3";
        item.innerHTML = `
          <div class="row align-items-center">
            <div class="col-md-2"><img src="${producto.imagen}" class="img-fluid"></div>
            <div class="col-md-6">
              <h5>${producto.nombre}</h5>
              <p>$${producto.precio.toLocaleString()} CLP x ${producto.cantidad}</p>
            </div>
            <div class="col-md-4 text-end">
              <button class="btn btn-danger" onclick="eliminar(${index})">Eliminar</button>
            </div>
          </div>
        `;
        contenedor.appendChild(item);
      });

      document.getElementById("total").textContent = `$${total.toLocaleString()} CLP`;
    }

    function eliminar(index) {
      let carrito = JSON.parse(localStorage.getItem("carrito")) || [];
      carrito.splice(index, 1);
      localStorage.setItem("carrito", JSON.stringify(carrito));
      mostrarCarrito();
    }

    mostrarCarrito();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
